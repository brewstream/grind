description = 'Netty handlers for Grind: MPEG-TS decoding and health monitoring in a pipeline'

dependencies {
    api project(':grind-core')
    // api, not implementation: ByteBuf and ChannelHandler are in this module's
    // public API, so a consumer that only got them transitively at runtime could
    // not compile against it.
    api platform('io.netty:netty-bom:4.2.17.Final')
    api 'io.netty:netty-buffer'
    api 'io.netty:netty-transport'
    // api, not implementation: MpegTsDecoder extends ByteToMessageDecoder, which
    // lives here, so it is part of this module's public API. Declared as an
    // implementation detail it lands on a consumer's runtime classpath but not
    // their compile classpath, and they cannot subclass or even name the decoder.
    // The showcase hit exactly this within minutes of depending on the module.
    api 'io.netty:netty-codec'
}

mavenPublishing {
    coordinates(project.group.toString(), 'grind-netty', project.version.toString())
    pom {
        name = 'Grind Netty'
        description = project.description
    }
}

base {
    archivesName = 'grind-netty'
}

// Shares core's fixture rather than duplicating 111KB of binary into git. One
// stream, one place to regenerate it, no chance of the two drifting apart.
sourceSets {
    test {
        resources.srcDir project(':grind-core').file('src/test/resources')
    }
}
